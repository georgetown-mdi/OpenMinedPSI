# Builds the native N-API PSI addon (private_set_intersection/napi) as a
# prebuilt .node for every supported platform, then packs a single
# @openmined/psi.js tarball carrying all of them plus the WASM engine. Consumers
# resolve the right prebuild at load time with node-gyp-build; no end-user
# compiler is needed.
#
# Manual: run from the Actions tab (workflow_dispatch). The `attest` job's
# `openmined-psi-tarball` artifact is what gets vendored downstream (e.g.
# psilink's lib/). Checking `release` on a master dispatch also publishes it,
# with its sha256, as the GitHub Release v<package version>.
# Scheduled: a weekly run builds and validates every leg. Every run, scheduled
# or dispatched, uploads the per-platform `prebuild-*` binaries, `bundle-dist`
# and the `packed-tarball` the later jobs read, none of them attested. Only a
# dispatched run runs `attest`, which signs the tarball's provenance and uploads
# it as `openmined-psi-tarball`.
#
# Node-API is ABI-stable, so one .node per (OS, arch, libc) serves every
# supported Node -- the addon is built against a pinned N-API level (NAPI_VERSION
# in MODULE.bazel) and loads on any Node with that N-API version or newer.
#
# LINUX PORTABILITY. The Linux legs are cross-compiled with the hermetic zig cc
# toolchain (hermetic_cc_toolchain, pinned in MODULE.bazel), NOT the runner's
# system GCC. Two consequences:
#   - the glibc legs target glibc 2.28 (the ceiling the symbol-scan gate
#     enforces), set by the pinned zig SDK rather than the runner; in practice
#     the addon references no symbol newer than GLIBC_2.17, so it loads on
#     Debian 12 / Ubuntu 22.04 / the node:26-bookworm dev container and well
#     below -- the runner's own glibc is irrelevant and not load-bearing;
#   - zig can target musl, so there is an Alpine (node:*-alpine) prebuild too.
# Both are byte-identical to the glibc build and to the WASM engine. The floor is
# enforced by a symbol-scan gate (check-libc-floor.sh) per leg, so drift like the
# earlier GLIBC_2.38 regression fails the build instead of shipping silently.
#
# Job layout:
#   build-addon      matrix, one native .node per (OS, arch, libc)
#   validate-linux   matrix, load each Linux prebuild in its real libc/arch
#                    (glibc -> node:*-bookworm-slim, musl -> node:*-alpine) on a
#                    native runner -- no emulation
#   build-bundle     the arch-independent WASM/rollup dist/ tree; NO
#                    `needs` so it runs alongside build-addon
#   package          downloads the prebuilds + bundle, folds them in, packs, and
#                    records the tarball's sha256 as a job output
#   validate-tarball installs the tarball, its dependencies resolved from the
#                    registry with no lockfile, and runs the worker-teardown
#                    gate; holds no scope beyond contents: read
#   attest           dispatch only; checks the tarball against package's
#                    sha256, signs its provenance, and uploads it; runs no
#                    registry code
#   release          dispatch from master with `release` checked only;
#                    publishes the attested tarball and its sha256 as the
#                    GitHub Release v<package version>, which Alcove's
#                    psi_revendor.yaml polls; runs no repository or registry
#                    code

name: Native prebuilds

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish the attested tarball as Release v<package version> (master only)"
        type: boolean
        default: false
  schedule:
    - cron: "45 5 * * 1"

# Least privilege by default: the build and validate jobs only read the
# repository and exchange artifacts (a runtime-scoped Actions API, not the
# GITHUB_TOKEN), so they need no write scope. The `attest` job raises exactly
# the two scopes signing an attestation requires, and raises them there rather
# than here so nothing else in the workflow runs with them; the `release` job
# raises `contents: write` the same way.
permissions:
  contents: read

defaults:
  run:
    # git-bash on Windows, so the build steps are one script across platforms.
    shell: bash

jobs:
  build-addon:
    name: addon (${{ matrix.target }}${{ matrix.libc && format(' {0}', matrix.libc) || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: all four (arch x libc) legs cross-compile with zig cc on the
          # same x64 runner. The runner arch/glibc does not affect the output --
          # the zig SDK does -- so there is no need for a native arm64 build
          # runner here. `zig` is the hermetic_cc_toolchain libc-aware target.
          - { os: ubuntu-24.04, target: linux-x64,   libc: glibc, zig: linux_amd64_gnu.2.28 }
          - { os: ubuntu-24.04, target: linux-x64,   libc: musl,  zig: linux_amd64_musl }
          - { os: ubuntu-24.04, target: linux-arm64, libc: glibc, zig: linux_arm64_gnu.2.28 }
          - { os: ubuntu-24.04, target: linux-arm64, libc: musl,  zig: linux_arm64_musl }
          # Each macOS leg builds natively on a runner of its own arch. The .node
          # links with -undefined dynamic_lookup, so no import library is needed.
          # The floor check after the build holds the addon's Mach-O `arch` and
          # its LC_BUILD_VERSION minos to these values.
          - { os: macos-15, target: darwin-arm64, arch: arm64, macos_min: "11.0" }
          - { os: macos-15-intel, target: darwin-x64, arch: x86_64, macos_min: "10.15" }
          # Windows is the finicky target: the .node link resolves N-API symbols
          # against Node's import library (node.lib), and the transitive
          # rules_swift toolchain probe needs a real Swift install even though
          # nothing here uses Swift. Both are wired below.
          - { os: windows-latest, target: win32-x64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes; keep the token out of the checkout's git config.
          # setup-bazel below still exports it, read-only, to every later step
          # as BAZELISK_GITHUB_TOKEN.
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          # No cache: a signed build reads nothing another job could write; every run builds cold (the Windows leg took about 9 minutes cold).
          bazelisk-cache: false
          repository-cache: false
          disk-cache: false

      - name: Fetch Node import library (Windows)
        # node.lib resolves the napi_* imports the addon links against; the
        # N-API headers come from MODULE.bazel, so it is the only file needed.
        # It is fetched at a pinned Node release and checked against a pinned
        # sha256 (the value in that release's SHASUMS256.txt), from the URL
        # `node-gyp install` fetches it from. To move it, take the new
        # release's win-x64/node.lib line from its SHASUMS256.txt.
        if: runner.os == 'Windows'
        env:
          NODE_LIB_VERSION: 22.23.3
          NODE_LIB_SHA256: c243185f2347870cadb637c909bf123fc703dc65dbfa769b17ec45a4b661d782
        run: |
          node_lib="$RUNNER_TEMP/node.lib"
          curl -fsSL --retry 3 -o "$node_lib" \
            "https://nodejs.org/download/release/v${NODE_LIB_VERSION}/win-x64/node.lib"
          actual=$(sha256sum < "$node_lib" | cut -d' ' -f1)
          if [ "$actual" != "$NODE_LIB_SHA256" ]; then
            echo "::error::node.lib v${NODE_LIB_VERSION} sha256 $actual does not match the pinned $NODE_LIB_SHA256"
            exit 1
          fi
          echo "NODE_LIB=$node_lib" >> "$GITHUB_ENV"
          echo "resolved node.lib: $node_lib"

      - name: Set up Swift (Windows)
        # rules_swift is pulled in transitively (by protobuf) and its Windows
        # toolchain autoconfiguration hard-fails when no Swift compiler is on
        # PATH -- it needs swiftc, SDKROOT, and the SDK's Info.plist. This addon
        # is pure C++ and never invokes Swift (Linux degrades quietly; only the
        # Windows path is strict), so install a real toolchain purely to satisfy
        # the probe. The installer runs elevated, so it is checked against a
        # pinned sha256 before it runs; swift.org publishes no checksum or
        # signature for it, so the pin is the hash of the installer as it was
        # served when pinned. To move it, change the two names and hash the new
        # installer. Downloaded on every run, uncached (about 2 minutes).
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SWIFT_VERSION: swift-6.3.3-release
          SWIFT_BUILD: 6.3.3-RELEASE
          SWIFT_INSTALLER_SHA256: 235626548f249cd516d3d4d90eee980dccad46f3822dac1f8e3119b0fede94b7
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'swift-installer.exe'
          $url = "https://download.swift.org/$env:SWIFT_VERSION/windows10/swift-$env:SWIFT_BUILD/swift-$env:SWIFT_BUILD-windows10.exe"
          & curl.exe --fail --silent --show-error --location --retry 3 --output $installer $url
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Swift installer download failed: $url"
            exit 1
          }
          $actual = (Get-FileHash -Algorithm SHA256 -Path $installer).Hash.ToLowerInvariant()
          if ($actual -ne $env:SWIFT_INSTALLER_SHA256) {
            Write-Host "::error::Swift installer $env:SWIFT_BUILD sha256 $actual does not match the pinned $env:SWIFT_INSTALLER_SHA256"
            exit 1
          }

          $log = Join-Path $env:RUNNER_TEMP 'swift-install.log'
          $process = Start-Process -FilePath $installer -ArgumentList '/quiet', '/log', $log -Wait -PassThru -Verb RunAs
          if ($process.ExitCode -notin 0, 3010) {
            Write-Host "::error::Swift installer exited with code $($process.ExitCode); see $log"
            exit 1
          }

          # The installer sets Path, SDKROOT and the rest at machine and user
          # level, which this runner's later steps do not read; carry every
          # changed variable into them, its Path entries after the current ones.
          $path = @($env:Path -split ';')
          foreach ($level in 'Machine', 'User') {
            $vars = [Environment]::GetEnvironmentVariables($level)
            foreach ($name in $vars.Keys) {
              $value = $vars[$name]
              if ($name -eq 'Path') {
                $path += $value -split ';'
              } elseif ([Environment]::GetEnvironmentVariable($name) -ne $value) {
                "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                Set-Item -Path "Env:$name" -Value $value
              }
            }
          }
          $env:Path = ($path | Where-Object { $_ } | Select-Object -Unique) -join ';'
          $env:Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          swift --version
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::swift --version exited with code $LASTEXITCODE"
            exit 1
          }

      - name: Build addon
        run: |
          if [ -n "${{ matrix.zig }}" ]; then
            # Linux: cross-compile with the hermetic zig cc toolchain for a low
            # glibc floor / musl. --force_pic makes the static deps (BoringSSL,
            # protobuf, abseil) position-independent, which the musl leg needs to
            # link as a shared object (their thread_local TLS would otherwise use
            # the local-exec model, illegal in a -shared .node); a no-op for the
            # glibc leg, which is already PIC. The version script in napi/BUILD
            # keeps the addon's statically linked libc++ from being interposed by
            # the host process's libstdc++.
            bazel build -c opt --strip=always --config=napi --force_pic \
              --platforms=@zig_sdk//libc_aware/platform:${{ matrix.zig }} \
              --extra_toolchains=@zig_sdk//libc_aware/toolchain:${{ matrix.zig }} \
              //private_set_intersection/napi:addon
          elif [ "${{ runner.os }}" = "Windows" ]; then
            # MSVC does not allow undefined symbols; link Node's import library.
            # MSVC also needs /std:c++17 explicitly: the repo's Unix -std=c++17
            # cxxopt is ignored by cl.exe, which then defaults below C++17 and
            # trips abseil's version check. Host tools (protoc) need it too.
            # protobuf 30.2 hard-errors on MSVC+Bazel unless protobuf_allow_msvc.
            # No `eval`: the --linkopt value is passed as one double-quoted
            # argument, so $NODE_LIB still expands but a Windows path with spaces
            # or shell metacharacters is inert.
            bazel build -c opt --config=napi \
              --cxxopt=/std:c++17 --host_cxxopt=/std:c++17 \
              --define=protobuf_allow_msvc=true \
              "--linkopt=$NODE_LIB" \
              //private_set_intersection/napi:addon
          else
            # macOS: a native build for the runner's arch. The deployment
            # target is set with --macos_minimum_os, not -mmacosx-version-min:
            # the apple_support toolchain passes `-target
            # <arch>-apple-macosx<macos_minimum_os>` after every copt and
            # linkopt, and clang lets that triple override
            # -mmacosx-version-min. Left unset, macos_minimum_os defaults to
            # the runner's Xcode SDK version.
            bazel build -c opt --strip=always --config=napi \
              --macos_minimum_os=${{ matrix.macos_min }} \
              //private_set_intersection/napi:addon
          fi

      - name: Check architecture and minimum macOS (macOS)
        # Fails the leg unless the addon is a single-architecture Mach-O of the
        # leg's arch whose one LC_BUILD_VERSION load command carries the leg's
        # macos_min, so a toolchain or runner change cannot raise the floor
        # without failing here.
        if: runner.os == 'macOS'
        env:
          WANT_ARCH: ${{ matrix.arch }}
          WANT_MINOS: ${{ matrix.macos_min }}
        run: |
          addon=bazel-bin/private_set_intersection/napi/psi_native.node
          archs=$(lipo -archs "$addon")
          minos=$(vtool -show-build "$addon" | awk '$1 == "minos" { printf "%s%s", sep, $2; sep = " " }')
          echo "addon architectures: $archs; LC_BUILD_VERSION minos: $minos"
          if [ "$archs" != "$WANT_ARCH" ]; then
            echo "::error::addon architectures are '$archs', expected '$WANT_ARCH'"
            exit 1
          fi
          if [ "$minos" != "$WANT_MINOS" ]; then
            echo "::error::addon LC_BUILD_VERSION minos is '$minos', expected exactly one, '$WANT_MINOS'"
            exit 1
          fi

      - name: Enforce libc floor (Linux)
        # Fail the leg if the built addon would not load on the platforms psilink
        # targets: glibc floor above 2.28, any dynamic libstdc++ (GLIBCXX_) dep,
        # a musl build with glibc symbols, or a re-exported C++ runtime. This is
        # what prevents a toolchain/runner change from silently raising the floor.
        if: matrix.libc
        run: |
          # Derive the glibc floor from the zig target (linux_<arch>_gnu.2.28) so
          # the gate and the toolchain never drift apart; the musl leg keeps the
          # default and ignores it.
          floor=2.28
          case "${{ matrix.zig }}" in *gnu.*) floor="${{ matrix.zig }}"; floor="${floor##*gnu.}" ;; esac
          bash private_set_intersection/napi/check-libc-floor.sh \
            bazel-bin/private_set_intersection/napi/psi_native.node \
            "${{ matrix.libc }}" "$floor"

      - name: Liveness check (loads + runs a real setup)
        # Native-load smoke test where the runner can dlopen the .node: macOS
        # arm64 and x64, and Windows x64. Skipped for every Linux leg (its
        # target libc/arch is validated natively in validate-linux instead).
        if: runner.os != 'Linux'
        run: |
          node -e "
            const addon = require('./bazel-bin/private_set_intersection/napi/psi_native.node');
            const s = addon.PsiServer.CreateWithNewKey(true);
            if (s.Status) throw new Error(s.Status.Message);
            const r = s.Value.CreateSetupMessage(0, -1, ['a', 'b', 'c'], addon.DataStructure.Raw, false);
            if (r.Status) throw new Error(r.Status.Message);
            console.log('addon OK on ${{ matrix.target }}; setup bytes:', r.Value.length);
            s.Value.delete();
          "

      - name: Stage prebuild
        run: |
          # node-gyp-build resolves prebuilds/<platform>-<arch>/<file>. The two
          # Linux legs share a directory but carry a libc tag in the filename so
          # a glibc build is never selected under musl (or vice versa); darwin and
          # windows stay untagged (one libc each).
          mkdir -p "staging/${{ matrix.target }}"
          cp bazel-bin/private_set_intersection/napi/psi_native.node \
            "staging/${{ matrix.target }}/node.napi${{ matrix.libc && format('.{0}', matrix.libc) || '' }}.node"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prebuild-${{ matrix.target }}${{ matrix.libc && format('-{0}', matrix.libc) || '' }}
          path: staging/
          if-no-files-found: error

  validate-linux:
    name: validate (${{ matrix.target }} ${{ matrix.libc }})
    needs: build-addon
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Load each Linux prebuild in its real libc, on a native runner (arm64
          # legs on the free public arm64 runner -- no QEMU). glibc is validated
          # on Debian bookworm (glibc 2.36, the dev-container libc); musl on
          # Alpine (the shipped CLI image's libc). The symbol-scan gate already
          # proved the floor; this proves the addon actually loads and runs. The
          # image tags float on purpose: this is a load test, so tracking the
          # current bookworm/alpine libc is the point -- the shipped floor is
          # fixed by the symbol-scan gate, not by these images.
          - { target: linux-x64,   libc: glibc, os: ubuntu-24.04,     image: "node:22-bookworm-slim" }
          - { target: linux-x64,   libc: musl,  os: ubuntu-24.04,     image: "node:22-alpine" }
          - { target: linux-arm64, libc: glibc, os: ubuntu-24.04-arm, image: "node:22-bookworm-slim" }
          - { target: linux-arm64, libc: musl,  os: ubuntu-24.04-arm, image: "node:22-alpine" }
    steps:
      - name: Download prebuild
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prebuild-${{ matrix.target }}-${{ matrix.libc }}
          path: staging

      - name: Load + run the addon in a ${{ matrix.libc }} container
        run: |
          docker run --rm -v "$PWD/staging/${{ matrix.target }}:/p:ro" "${{ matrix.image }}" \
            node -e "
              const addon = require('/p/node.napi.${{ matrix.libc }}.node');
              const s = addon.PsiServer.CreateWithNewKey(true);
              if (s.Status) throw new Error(s.Status.Message);
              const r = s.Value.CreateSetupMessage(0, -1, ['a', 'b', 'c'], addon.DataStructure.Raw, false);
              if (r.Status) throw new Error(r.Status.Message);
              // exercise the threaded EC path (>1024 elements) too
              const big = Array.from({ length: 2000 }, (_, i) => 'e' + i);
              const r2 = s.Value.CreateSetupMessage(0, -1, big, addon.DataStructure.Raw, false);
              if (r2.Status) throw new Error(r2.Status.Message);
              console.log('addon OK on ${{ matrix.target }}/${{ matrix.libc }}: setup', r.Value.length, 'threaded', r2.Value.length);
              s.Value.delete();
            "

  build-bundle:
    name: build WASM + rollup bundle
    # No `needs`: the arch-independent WASM/rollup work has no dependency
    # on the native addons, so it runs in parallel with build-addon instead of
    # after it. package waits on both.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes; keep the token out of the checkout's git config.
          # setup-bazel below still exports it, read-only, to every later step
          # as BAZELISK_GITHUB_TOKEN.
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          # No cache: a signed build reads nothing another job could write; every run builds cold (the WASM outputs included).
          bazelisk-cache: false
          repository-cache: false
          disk-cache: false

      - name: Install JS toolchain (rollup + plugins)
        # No package install scripts: the bundle build uses the committed
        # protobuf bindings and needs no package that sets one up.
        run: npm ci --ignore-scripts

      - name: Build arch-independent bundle (WASM + rollup)
        run: bash private_set_intersection/javascript/scripts/build-bundle.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-dist
          # The dist/ tree, ready to pack once the prebuilds are folded in.
          path: private_set_intersection/javascript/dist/
          if-no-files-found: error

  package:
    name: gather + pack tarball
    needs: [build-addon, validate-linux, build-bundle]
    runs-on: ubuntu-24.04
    # Runs no registry-resolved code, so the sha256 it records is taken before
    # any unlocked install can touch the tarball.
    outputs:
      tarball: ${{ steps.hash.outputs.tarball }}
      sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      # Checkout only supplies the pack script; this job runs no build.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Download bundle (dist/)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle-dist
          path: private_set_intersection/javascript/dist

      - name: Gather prebuilds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: prebuild-*
          path: prebuilds-dist
          merge-multiple: true

      - name: Fold in prebuilds + pack
        run: |
          bash private_set_intersection/javascript/scripts/pack-native-package.sh \
            "$GITHUB_WORKSPACE/prebuilds-dist"

      - name: Record tarball sha256
        # Another job in the run can overwrite a same-named artifact, so the
        # jobs that read the tarball hold it against this value.
        id: hash
        run: |
          set -- private_set_intersection/javascript/dist/openmined-psi.js-*.tgz
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "::error::expected exactly one packed tarball, found $#"
            exit 1
          fi
          echo "tarball=$(basename "$1")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum < "$1" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packed-tarball
          path: private_set_intersection/javascript/dist/openmined-psi.js-*.tgz
          if-no-files-found: error

  validate-tarball:
    name: validate tarball (worker teardown)
    needs: package
    runs-on: ubuntu-24.04
    steps:
      # Checkout only supplies the validation harness.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Download tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packed-tarball
          path: packed

      - name: Check tarball against package's sha256
        # So the gate below tests the bytes attest signs.
        env:
          EXPECTED_TARBALL: ${{ needs.package.outputs.tarball }}
          EXPECTED_SHA256: ${{ needs.package.outputs.sha256 }}
        run: |
          set -- packed/openmined-psi.js-*.tgz
          if [ "$#" -ne 1 ] || [ ! -f "$1" ] || [ "$(basename "$1")" != "$EXPECTED_TARBALL" ]; then
            echo "::error::expected exactly one tarball named $EXPECTED_TARBALL"
            exit 1
          fi
          actual=$(sha256sum < "$1" | cut -d' ' -f1)
          if [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "::error::tarball sha256 $actual does not match the packed $EXPECTED_SHA256"
            exit 1
          fi

      - name: Validate worker-teardown safety
        # HARD regression gate for the worker_threads teardown SIGSEGV the napi
        # binding fixes (the OPENSSL_thread_stop drain in
        # private_set_intersection/napi/psi_napi.cpp). Installs the freshly packed
        # tarball exactly as a consumer does and drives the REAL native loader
        # through worker load / crypto op / terminate across the crash matrix; a
        # thread-exit destructor re-armed after the drain crashes the worker
        # (exit 139), fails this step, and so skips `attest`, which signs and
        # uploads `openmined-psi-tarball`. Runs on the runner's glibc x64 -- the libc that actually unloads the addon (musl
        # dlclose is a no-op; macOS and Windows differ), so it is where the crash
        # can occur; the regression it guards lives in shared C++ and so surfaces
        # here. Detection is best-effort only in that a teardown crash can be
        # nondeterministic, so the harness stress-loops rather than proving absence.
        # timeout-minutes bounds a hung worker (no per-case timeout in the harness)
        # so it fails fast instead of riding the job's default timeout.
        timeout-minutes: 10
        env:
          TARBALL: ${{ needs.package.outputs.tarball }}
        run: |
          tarball_path="$GITHUB_WORKSPACE/packed/$TARBALL"
          work="$(mktemp -d)"
          cp "$GITHUB_WORKSPACE/worker-teardown-validation.mjs" "$work/"
          # This install is an unpinned resolution of the tarball's transitive
          # deps from the registry, which is why this job holds no scope beyond
          # contents: read. The harness only needs require-time resolution
          # (node-gyp-build finds the bundled prebuild), so --ignore-scripts
          # blocks any dependency lifecycle script.
          ( cd "$work" \
            && npm init -y >/dev/null \
            && npm install --no-audit --no-fund --ignore-scripts "$tarball_path" >/dev/null \
            && node worker-teardown-validation.mjs \
                 ./node_modules/@openmined/psi.js/psi_native_node.js )

  attest:
    name: attest + upload tarball
    # Every validation job gates the attestation and the upload. Job-level
    # permissions cannot depend on the event, so the signing scopes live on a
    # job that only a dispatched run reaches.
    needs: [build-addon, validate-linux, build-bundle, package, validate-tarball]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # The OIDC token Sigstore's Fulcio issues this job's signing certificate
      # against. Keyless: no signing key is stored, rotated, or read anywhere.
      id-token: write
      # actions/attest-build-provenance's write to this repository's attestation
      # store, which is where a downstream consumer reads the claim from.
      attestations: write
    # No checkout, no setup-node, no install: this job runs no registry code.
    steps:
      - name: Download tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packed-tarball
          path: private_set_intersection/javascript/dist

      - name: Check tarball against package's sha256
        env:
          EXPECTED_TARBALL: ${{ needs.package.outputs.tarball }}
          EXPECTED_SHA256: ${{ needs.package.outputs.sha256 }}
        run: |
          set -- private_set_intersection/javascript/dist/openmined-psi.js-*.tgz
          if [ "$#" -ne 1 ] || [ ! -f "$1" ] || [ "$(basename "$1")" != "$EXPECTED_TARBALL" ]; then
            echo "::error::expected exactly one tarball named $EXPECTED_TARBALL"
            exit 1
          fi
          actual=$(sha256sum < "$1" | cut -d' ' -f1)
          if [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "::error::tarball sha256 $actual does not match the packed $EXPECTED_SHA256"
            exit 1
          fi

      - name: Attest build provenance
        # Binds the packed tarball's sha256 to this workflow run -- repository,
        # workflow path, ref, and commit -- as a Sigstore-signed SLSA provenance
        # statement stored against THIS repository's attestation store. That is
        # the point: the claim lives outside any consumer's commit, so a
        # consumer that vendors the tarball can verify where the bytes came from
        # without trusting its own copy of them. Downstream (psilink) reads it
        # with `gh attestation verify --repo <this repo> --signer-workflow
        # <this workflow> --source-digest <this commit>`.
        #
        # Placed ahead of the upload so `openmined-psi-tarball` is only uploaded
        # once its provenance was signed, and only on a dispatched run. The
        # `package` job uploads an unattested `packed-tarball` on every run for
        # the validation and attest jobs to read; it is an intermediate, not
        # something to vendor.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: private_set_intersection/javascript/dist/openmined-psi.js-*.tgz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openmined-psi-tarball
          path: private_set_intersection/javascript/dist/openmined-psi.js-*.tgz
          if-no-files-found: error

  release:
    name: publish release
    # A Release asset outlives the 90-day artifact, and is what a consumer
    # polls for (Alcove's psi_revendor.yaml reads the latest Release). Only a
    # master dispatch with `release` checked runs it: a consumer verifies the
    # attestation against refs/heads/master, so a branch run's Release would
    # never verify. A release made with the GITHUB_TOKEN starts no workflow.
    needs: [package, attest]
    if: github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      # Creates the tag and the Release.
      contents: write
    # No checkout, no setup-node, no install: this job runs no repository or
    # registry code.
    steps:
      - name: Download attested tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openmined-psi-tarball
          path: release

      - name: Check tarball against package's sha256
        env:
          EXPECTED_TARBALL: ${{ needs.package.outputs.tarball }}
          EXPECTED_SHA256: ${{ needs.package.outputs.sha256 }}
        run: |
          set -- release/openmined-psi.js-*.tgz
          if [ "$#" -ne 1 ] || [ ! -f "$1" ] || [ "$(basename "$1")" != "$EXPECTED_TARBALL" ]; then
            echo "::error::expected exactly one tarball named $EXPECTED_TARBALL"
            exit 1
          fi
          actual=$(sha256sum < "$1" | cut -d' ' -f1)
          if [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "::error::tarball sha256 $actual does not match the packed $EXPECTED_SHA256"
            exit 1
          fi

      - name: Create the Release
        # The tag is the package version and is created here at the run's
        # commit, the commit the attestation names; an existing tag fails the
        # job, so a version is released once and never replaced.
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ needs.package.outputs.tarball }}
          SHA256: ${{ needs.package.outputs.sha256 }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          version="${TARBALL#openmined-psi.js-}"
          version="${version%.tgz}"
          # The fork's version form, the one Alcove's psi_revendor.yaml accepts;
          # any other suffix would be published as the latest Release.
          if ! [[ "$version" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}-alcove\.[0-9]{1,4}$ ]]; then
            echo "::error::package version '$version' is not <upstream version>-alcove.<N>, e.g. 2.0.6-alcove.2; only that form is released"
            exit 1
          fi
          tag="v$version"
          if probe=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" 2>&1); then
            echo "::error::tag $tag already exists; bump the package version to release a new build"
            exit 1
          elif ! grep -q 'HTTP 404' <<< "$probe"; then
            echo "::error::could not check whether tag $tag exists: ${probe//$'\n'/ }"
            exit 1
          fi
          cd release
          printf '%s  %s\n' "$SHA256" "$TARBALL" > "$TARBALL.sha256"
          {
            echo "Native prebuilds run: $RUN_URL"
            echo "Commit: $GITHUB_SHA"
            echo "sha256: $SHA256"
          } > notes.md
          gh release create "$tag" "$TARBALL" "$TARBALL.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$tag" --notes-file notes.md --latest
